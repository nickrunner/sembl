name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema extraction runs as part of the examples package's own build,
      # which pnpm orders after the compiler it depends on.
      - run: pnpm build

      - run: pnpm test

      # Typechecks each package against the built .d.ts of its dependencies,
      # so it has to follow the build.
      - name: Typecheck
        run: pnpm lint

      # Guards the dual ESM/CJS exports map: a consumer on either module system
      # must resolve both the code and the matching types.
      - name: Check package exports
        run: pnpm check:exports
