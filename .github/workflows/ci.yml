name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated schemas are gitignored, and the examples package imports its
      # bundle, so extraction has to run before anything is compiled.
      - name: Extract example schemas
        run: pnpm --filter @sembl/examples extract

      - run: pnpm build

      - run: pnpm test

      - name: Typecheck
        run: pnpm lint
